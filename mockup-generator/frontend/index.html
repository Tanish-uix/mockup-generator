<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mockup Generator</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.subtitle { color: #666; font-size: 14px; margin-top: 0; margin-bottom: 28px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; margin-top: 20px; }
  input[type="text"], input[type="password"], input[type="file"] {
    width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
  }
  .checkbox-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  button {
    margin-top: 28px; width: 100%; padding: 12px; background: #1a1a1a; color: white;
    border: none; border-radius: 6px; font-size: 14px; cursor: pointer;
  }
  button:disabled { background: #999; cursor: not-allowed; }
  #status { margin-top: 16px; font-size: 13px; color: #444; white-space: pre-wrap; }
  .hint { font-size: 12px; color: #888; margin-top: 4px; }
</style>
</head>
<body>

<h1>Mockup Generator</h1>
<p class="subtitle">Upload a logo, pick mockup types, generate.</p>

<label for="pat">GitHub Personal Access Token</label>
<input type="password" id="pat" placeholder="ghp_..." />
<p class="hint">Saved in your browser only. Needs "repo" + "workflow" scopes. See the setup guide for how to create one.</p>

<label for="owner">Repo owner / repo name</label>
<input type="text" id="repoPath" placeholder="yourusername/mockup-generator" />

<label>Logo file</label>
<input type="file" id="logoFile" accept="image/*" />

<label>Mockup types</label>
<div class="checkbox-list" id="checkboxList">Loading options...</div>

<button id="submitBtn">Generate Mockups</button>

<div id="status"></div>

<script>
const patInput = document.getElementById('pat');
const repoInput = document.getElementById('repoPath');
const checkboxList = document.getElementById('checkboxList');
const submitBtn = document.getElementById('submitBtn');
const statusEl = document.getElementById('status');
const logoFileInput = document.getElementById('logoFile');

// Restore saved values
patInput.value = localStorage.getItem('mockup_pat') || '';
repoInput.value = localStorage.getItem('mockup_repo') || '';
patInput.addEventListener('change', () => localStorage.setItem('mockup_pat', patInput.value));
repoInput.addEventListener('change', () => localStorage.setItem('mockup_repo', repoInput.value));

// Load mockup type options from config/mockup-types.json
fetch('../config/mockup-types.json')
  .then(r => r.json())
  .then(data => {
    checkboxList.innerHTML = '';
    data.mockup_types.forEach(type => {
      const row = document.createElement('div');
      row.className = 'checkbox-row';
      row.innerHTML = `
        <input type="checkbox" id="type-${type.id}" value="${type.id}" checked />
        <label for="type-${type.id}" style="margin:0; font-weight:400;">${type.label}</label>
      `;
      checkboxList.appendChild(row);
    });
  })
  .catch(() => {
    checkboxList.innerHTML = '<span style="color:red; font-size:13px;">Could not load mockup-types.json. Check the path.</span>';
  });

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

submitBtn.addEventListener('click', async () => {
  const pat = patInput.value.trim();
  const repoPath = repoInput.value.trim();
  const logoFile = logoFileInput.files[0];
  const selected = Array.from(checkboxList.querySelectorAll('input[type=checkbox]:checked')).map(cb => cb.value);

  if (!pat || !repoPath) { statusEl.textContent = 'Please fill in your token and repo name.'; return; }
  if (!logoFile) { statusEl.textContent = 'Please choose a logo file.'; return; }
  if (selected.length === 0) { statusEl.textContent = 'Pick at least one mockup type.'; return; }

  submitBtn.disabled = true;
  statusEl.textContent = 'Encoding logo...';

  try {
    const logoBase64 = await fileToBase64(logoFile);

    statusEl.textContent = 'Triggering the workflow on GitHub...';

    const response = await fetch(`https://api.github.com/repos/${repoPath}/actions/workflows/generate.yml/dispatches`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${pat}`,
        'Accept': 'application/vnd.github+json'
      },
      body: JSON.stringify({
        ref: 'main',
        inputs: {
          selected_types: selected.join(','),
          logo_base64: logoBase64
        }
      })
    });

    if (response.status === 204) {
      statusEl.textContent = 'Triggered! Go to your repo\'s "Actions" tab to watch it run. Once it finishes, check the "Releases" tab for your mockups.';
    } else {
      const errText = await response.text();
      statusEl.textContent = `GitHub API error (${response.status}): ${errText}`;
    }
  } catch (err) {
    statusEl.textContent = `Error: ${err.message}`;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
